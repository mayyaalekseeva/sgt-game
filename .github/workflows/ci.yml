name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # worker-configuration.d.ts is committed; fail if it no longer matches wrangler.jsonc
      - run: npx wrangler types --check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
